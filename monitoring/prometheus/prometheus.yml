global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Метрики по контейнерам (CPU/RAM/сеть/диск каждого сервиса).
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Метрики хоста-сервера.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
