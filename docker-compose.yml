services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tochka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tochka_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-tochka}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tochka} -d ${POSTGRES_DB:-tochka}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://tochka:tochka_dev_password@db:5432/tochka}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-72}
      BACKEND_PORT: ${BACKEND_PORT:-8080}
      UPLOADS_DIR: /data/uploads
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    expose:
      - "8080"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - uploads:/usr/share/nginx/html/uploads:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    command: >-
      /bin/sh -c "/docker-entrypoint.d/20-envsubst-on-templates.sh; while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"
    depends_on:
      - backend

  # Выпуск и автопродление сертификатов Let's Encrypt (webroot-челлендж).
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >-
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"

  # Одноразовый перенос альманаха в БД: docker compose run --rm seed
  seed:
    image: node:20-alpine
    profiles: ["tools"]
    working_dir: /seed
    volumes:
      - ./db/seed:/seed
      - ./content:/content:ro
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://tochka:tochka_dev_password@db:5432/tochka}
      CONTENT_PATH: /content/sections.json
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm install --no-audit --no-fund --silent && node seed.mjs"

volumes:
  db_data:
  uploads:
